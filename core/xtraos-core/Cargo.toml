[package]
name = "xtraos-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "XtraOS Agent core runtime: local IPC, input, windows, perception."

[[bin]]
name = "xtraos-core"
path = "src/main.rs"

# Exact pins (CLAUDE.md §2). Why each is needed:
#  tokio      - async runtime + Windows named pipes (ServerOptions with reject_remote_clients,
#               first_pipe_instance, create_with_security_attributes_raw - verified in source)
#  serde      - (de)serialisation of protocol messages and log entries
#  serde_json - JSON-RPC framing
#  windows    - Microsoft's official bindings, used ONLY for COM / UI Automation and GDI capture
#               (ADR 0015: UIA vtables are too large to declare by hand safely)
#  png        - pure-Rust PNG encoder for screenshots (ADR 0015)
#               windows is also used for the safety UI: hotkey, tray, overlay, dialogs (ADR 0017)
#               and the built-in Windows OCR engine (WinRT Windows.Media.Ocr, ADR 0024)
[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
png = "=0.18.1"
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Storage_Xps",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_System_Wmi",
  "Win32_System_Rpc",
  "Win32_UI_Accessibility",
  "Win32_UI_Controls",
  "Win32_UI_Input_Pointer",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  "Win32_Security_Cryptography",
  "Win32_System_StationsAndDesktops",
  "Devices_Radios",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Security_Cryptography",
  "Storage_Streams",
] }

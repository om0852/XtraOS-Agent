# Publish the SDKs (ADR 0071). Runs ONLY when the owner starts it by hand.
#   npm:  needs the secret NPM_TOKEN with publish rights to the @xtraos scope.
#   PyPI: uses trusted publishing — configure this repository and workflow on pypi.org first.
name: publish-sdks
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'npm, pypi or both'
        required: true
        default: 'both'
permissions:
  contents: read
jobs:
  npm:
    if: inputs.target == 'npm' || inputs.target == 'both'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - name: Publish @xtraos/sdk
        working-directory: sdk/node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
  pypi:
    if: inputs.target == 'pypi' || inputs.target == 'both'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        working-directory: sdk/python
        run: |
          python -m pip install build==1.2.2 twine==6.1.0
          python -m build
          python -m twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xtraos"
version = "0.1.0"
description = "Python client for the XtraOS Agent core (Windows): call XtraOS tools from scripts and agents."
requires-python = ">=3.9"
dependencies = []
classifiers = ["Operating System :: Microsoft :: Windows"]

[tool.setuptools]
packages = ["xtraos"]

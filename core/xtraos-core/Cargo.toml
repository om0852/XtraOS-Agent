[package]
name = "xtraos-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "XtraOS Agent core runtime: local IPC, input, windows, perception."

[[bin]]
name = "xtraos-core"
path = "src/main.rs"

# Exact pins (CLAUDE.md §2). Why each is needed:
#  tokio      - async runtime + Windows named pipes (ServerOptions with reject_remote_clients,
#               first_pipe_instance, create_with_security_attributes_raw - verified in source)
#  serde      - (de)serialisation of protocol messages and log entries
#  serde_json - JSON-RPC framing
#  windows    - Microsoft's official bindings, used ONLY for COM / UI Automation and GDI capture
#               (ADR 0015: UIA vtables are too large to declare by hand safely)
#  png        - pure-Rust PNG encoder for screenshots (ADR 0015)
[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
png = "=0.18.1"
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_Xps",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
] }

# Release (ADR 0071): build, test, sign (when a certificate is configured), make winget
# manifests and upload to a DRAFT GitHub Release. A draft is not public: the owner reviews it and
# presses Publish on GitHub.
#
# Signing secrets (optional; without them the release is built unsigned):
#   XTRAOS_SIGN_PFX_BASE64   the code-signing certificate (.pfx) as base64
#   XTRAOS_SIGN_PFX_PASSWORD its password
name: release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v, e.g. 0.1.0'
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Version
        id: v
        shell: pwsh
        run: |
          $v = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '${{ github.ref_name }}'.TrimStart('v') }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "bad version '$v'" }
          "version=$v" >> $env:GITHUB_OUTPUT
      - run: rustup show
      - name: Tests
        shell: pwsh
        run: |
          Push-Location core; cargo test --lib; if ($LASTEXITCODE) { exit 1 }; cargo build; Pop-Location
          Push-Location mcp; npm ci; npm run typecheck; npm test; if ($LASTEXITCODE) { exit 1 }; Pop-Location
      - name: Signing certificate (if configured)
        id: cert
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.XTRAOS_SIGN_PFX_BASE64 }}
        run: |
          if ($env:PFX_B64) {
            $p = Join-Path $env:RUNNER_TEMP 'sign.pfx'
            [IO.File]::WriteAllBytes($p, [Convert]::FromBase64String($env:PFX_B64))
            "pfx=$p" >> $env:GITHUB_OUTPUT
          } else { Write-Host 'No signing certificate configured: building unsigned.' }
      - name: Build bundle
        shell: pwsh
        env:
          XTRAOS_SIGN_PFX_PASSWORD: ${{ secrets.XTRAOS_SIGN_PFX_PASSWORD }}
        run: |
          # Named parameters (a hashtable): splatting an array would pass them by position.
          $build = @{ Version = '${{ steps.v.outputs.version }}' }
          if ('${{ steps.cert.outputs.pfx }}') { $build.PfxPath = '${{ steps.cert.outputs.pfx }}' }
          ./release/build-release.ps1 @build
      - name: Remove the certificate file
        if: always()
        shell: pwsh
        run: if (Test-Path "$env:RUNNER_TEMP\sign.pfx") { Remove-Item -Force "$env:RUNNER_TEMP\sign.pfx" }
      - name: winget manifests
        shell: pwsh
        run: |
          $v = '${{ steps.v.outputs.version }}'
          $zip = "dist/xtraos-$v-win-x64.zip"
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash
          $url = "https://github.com/${{ github.repository }}/releases/download/v$v/xtraos-$v-win-x64.zip"
          ./release/winget/make-manifests.ps1 -Version $v -ZipUrl $url -Sha256 $sha -Out dist/winget
          Compress-Archive -Path dist/winget/* -DestinationPath "dist/winget-manifests-$v.zip"
      - name: Draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.v.outputs.version }}'
          gh release create "v$v" --draft --title "XtraOS Agent $v" --notes-file release/RELEASE_NOTES.md `
            "dist/xtraos-$v-win-x64.zip" dist/SHA256SUMS.txt "dist/winget-manifests-$v.zip"
